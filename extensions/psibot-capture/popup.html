<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsiBot Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>PsiBot Capture</h1>
      <div id="status" class="status status-unknown">
        <span class="status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </header>

    <nav class="tabs">
      <button id="tab-capture" class="tab-btn active" type="button">Capture</button>
      <button id="tab-archive" class="tab-btn" type="button">Archive</button>
    </nav>

    <section id="panel-capture" class="panel">
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="daily-count">0</span>
          <span class="stat-label">Today</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-count">0</span>
          <span class="stat-label">Total</span>
        </div>
      </div>

      <button id="save-btn" class="save-btn">Save This Page</button>
      <button id="x-bookmarks-btn" class="save-btn x-bookmarks-btn hidden" type="button">Save All X Bookmarks</button>

      <div id="feedback" class="feedback hidden"></div>

      <footer>
        <span id="last-capture"></span>
      </footer>
    </section>

    <section id="panel-archive" class="panel hidden">
      <form id="archive-search-form" class="archive-search-row">
        <input id="archive-search-input" type="text" placeholder="Search archived tabs..." autocomplete="off" />
        <button id="archive-search-btn" type="submit">Search</button>
      </form>

      <div id="archive-results" class="archive-results"></div>

      <div id="archive-sweep-status" class="archive-sweep-status">Last sweep: —</div>

      <details id="archive-settings-details" class="archive-settings">
        <summary>Server settings</summary>
        <label class="archive-field">
          <span>Server URL</span>
          <input id="archive-server-url" type="text" placeholder="http://localhost:4820" autocomplete="off" />
        </label>
        <label class="archive-field">
          <span>Bearer token</span>
          <input id="archive-token" type="password" placeholder="(optional)" autocomplete="off" />
        </label>
        <div class="archive-settings-actions">
          <button id="archive-save-settings-btn" type="button" class="secondary-btn">Save</button>
          <button id="archive-test-btn" type="button" class="secondary-btn">Test connection</button>
        </div>
        <p id="archive-settings-feedback" class="archive-settings-feedback"></p>
      </details>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
